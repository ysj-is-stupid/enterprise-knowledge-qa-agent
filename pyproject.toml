[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-qa-agent"
version = "0.1.0"
description = "Auditable enterprise knowledge question-answering agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
enterprise-qa = "enterprise_qa_agent.cli:entrypoint"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
